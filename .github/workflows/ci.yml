name: Integración continua

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilar, probar y generar reportes
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Dar permiso al Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar el proyecto
        run: ./mvnw -B clean compile

      - name: Ejecutar pruebas unitarias
        run: ./mvnw -B test

      - name: Verificar y generar cobertura
        run: ./mvnw -B verify

      - name: Publicar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-pruebas
          path: |
            target/surefire-reports/
            target/site/surefire-report.html
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-jacoco
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Crear resumen del pipeline
        if: always()
        run: |
          echo "## Resumen de integración continua" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rama: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Java: 17" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compilación y pruebas mediante Maven" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reportes Surefire y JaCoCo publicados" >> "$GITHUB_STEP_SUMMARY"
          echo "- Estado final: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"